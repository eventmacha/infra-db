name: Upsert DynamoDB Table data (Prod)

on:
  workflow_dispatch:
    description: "Manually trigger the execution upsert scripts on production DynamoDB."

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

jobs:
  upsert:
    name: Upsert Rate Cards (ap-south-1)
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js with caching enabled for faster package installs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'infra/package-lock.json'

      # 3. Clean install dependencies in the infra directory
      - name: Install Dependencies
        run: |
          cd infra
          npm ci

      # 4. Log in securely to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. Run the separate database upsert scripts
      - name: Execute All Upsert Scripts
        run: |
          cd infra
          npm run db:upsert:all
