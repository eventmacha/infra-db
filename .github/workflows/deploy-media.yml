name: Deploy Event Macha Media Infrastructure (Prod)

on:
  workflow_dispatch:
    description: "Manually trigger the deployment of the production Media stack."

permissions:
  id-token: write # Required for AWS OIDC authentication (highly recommended)
  contents: read

jobs:
  deploy:
    name: Deploy to Production (ap-south-1)
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js with caching enabled for faster package installs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'infra/package-lock.json'

      # 3. Clean install dependencies in the infra directory
      - name: Install Dependencies
        run: |
          cd infra
          npm ci

      # 4. Compile TypeScript codebase
      - name: Compile TypeScript
        run: |
          cd infra
          npm run build

      # 5. Log in securely to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. Dynamically bootstrap the AWS environment if not already completed
      - name: Bootstrap AWS Environment
        run: |
          cd infra
          npx cdk bootstrap

      # 7. Deploy the AWS CDK Production Media Stack
      - name: Deploy Production Media Stack
        run: |
          cd infra
          npx cdk deploy EventMachaMediaStack-prod -c environment=prod --require-approval never
