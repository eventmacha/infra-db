name: Deploy Event Macha Congito Infrastructure (Prod)

on:
  workflow_dispatch:
    description: "Manually trigger the deployment of the production Auth stack."

permissions:
  id-token: write # Required for AWS OIDC authentication (highly recommended)
  contents: read

jobs:
  deploy:
    name: Deploy to Production (ap-south-1)
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js with caching enabled for faster package installs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'infra/package-lock.json'

      # 3. Clean install dependencies in the infra directory
      - name: Install Dependencies
        run: |
          cd infra
          npm ci

      # 4. Compile TypeScript codebase
      - name: Compile TypeScript
        run: |
          cd infra
          npm run build

      # 5. Log in securely to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. Dynamically bootstrap the AWS environment if not already completed
      - name: Bootstrap AWS Environment
        run: |
          cd infra
          npx cdk bootstrap

      # 7. Deploy the AWS CDK Production Auth Stack
      - name: Deploy Production Auth Stack
        run: |
          cd infra
          npx cdk deploy EventMachaAuthStack-prod -c environment=prod --require-approval never

      # 8. Upload Event Macha Logo to Cognito Hosted UI
      - name: Set Cognito UI Logo
        run: |
          cd infra
          USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name EventMachaAuthStack-prod --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks --stack-name EventMachaAuthStack-prod --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)
          
          echo "Setting Logo for User Pool: $USER_POOL_ID, Client ID: $CLIENT_ID"
          aws cognito-idp set-ui-customization \
            --user-pool-id $USER_POOL_ID \
            --client-id $CLIENT_ID \
            --image-file fileb://assets/logo_small.png
