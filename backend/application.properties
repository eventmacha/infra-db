# ==============================================================================
# Event Macha Quarkus Backend DynamoDB Configuration
# ==============================================================================

# AWS Client Configurations
# Quarkus uses the AWS SDK v2 under the hood for reactive/blocking DynamoDB clients.
quarkus.dynamodb.aws.region=ap-south-1
quarkus.dynamodb.aws.credentials.type=default

# Local Development Settings (e.g., using local DynamoDB local)
# To run local tests against a local container, uncomment the lines below:
# %dev.quarkus.dynamodb.endpoint-override=http://localhost:8000
# %dev.quarkus.dynamodb.aws.credentials.type=static
# %dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=local-key
# %dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=local-secret

# DynamoDB Table Mappings
# These map environment variables (populated via CloudFormation stack outputs/lambda env vars)
# to application properties, using standard fallback defaults.
event-macha.tables.users=${EVENT_MACHA_USERS_TABLE_NAME:Users}
event-macha.tables.rate-cards=${EVENT_MACHA_RATE_CARDS_TABLE_NAME:RateCards}
event-macha.tables.rate-card-plans=${EVENT_MACHA_RATE_CARD_PLANS_TABLE_NAME:RateCardPlans}
event-macha.tables.orders=${EVENT_MACHA_ORDERS_TABLE_NAME:Orders}
event-macha.tables.payments=${EVENT_MACHA_PAYMENTS_TABLE_NAME:Payments}
event-macha.tables.payment-history=${EVENT_MACHA_PAYMENT_HISTORY_TABLE_NAME:PaymentHistory}

# Quarkus Developer Tips:
# ------------------------------------------------------------------------------
# 1. In your Java code, inject the DynamoDbClient and Table name:
#
#    @Inject
#    DynamoDbClient dynamoDbClient;
#
#    @ConfigProperty(name = "event-macha.tables.users")
#    String usersTableName;
#
# 2. To run locally with dev services, Quarkus can auto-provision a Dev Service
#    if docker is running and no credentials are provided.
